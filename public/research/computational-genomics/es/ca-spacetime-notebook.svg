.cg1 text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;font-size:13px}
.cg1 .ink{fill:#000}
.cg1 .sec{fill:#6e6e73}
.cg1 .hair{stroke:rgba(60,60,67,.29);fill:none}
.cg1 .emp{fill:none;stroke:rgba(60,60,67,.29)}
.cg1 .old{fill:#d1d1d6}
.cg1 .oldt{fill:#000}
.cg1 .new{fill:#3730a3}
.cg1 .newt{fill:#fff}
.cg1 .acc{fill:#3730a3}
.cg1 .lt{font-weight:600;text-anchor:middle}
.cg1 .b{font-weight:600}
.cg1 .ar{stroke:#6e6e73;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
</style>
