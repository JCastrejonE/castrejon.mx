<svg xmlns="http://www.w3.org/2000/svg" class="cg1" width="440" height="407" viewBox="0 0 440 407" role="img" aria-labelledby="cg1-t cg1-d">
<title id="cg1-t">La ejecución del autómata celular registrada en el notebook</title>
<desc id="cg1-d">Diagrama espacio-tiempo de la ejecución impresa en el notebook, 9 filas (pasos 0 a 8) por 17 celdas. En el paso 0, la celda 8 tiene una A. Después del paso 1, las celdas 7 a 15 contienen A A C A G A T G A. A partir de ahí aparece una celda nueva a la izquierda en cada paso: G en la celda 6, G en la celda 5, A en la celda 4, G en la celda 3, A en la celda 2, T en la celda 1. Los pasos 7 y 8 son idénticos. Fila final: vacía, T A G A G G A A C A G A T G A, vacía. Las celdas 0 y 16 se quedan vacías.</desc>
