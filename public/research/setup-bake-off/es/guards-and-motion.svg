<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 472 510" width="472" height="510" role="img" aria-labelledby="t d">
<title id="t">Qué protegían las pruebas de cada ejecución y cómo manejó cada una el movimiento reducido</title>
<desc id="d">Matriz con una fila por ejecución y tres columnas: si las propias pruebas de la ejecución fallaron cuando se rompió el núcleo de la simulación, si fallaron cuando se rompió la entrada del puntero, y la razón de movimiento reducido. A: núcleo detectado por pruebas unitarias; entrada detectada solo por una suite smoke fuera del comando de pruebas por defecto; razón 0.12. B: sin pruebas; sin pruebas; razón 1.26, ignorado. C: núcleo detectado por 3 pruebas; entrada detectada solo por una suite de navegador que necesita una configuración que el repositorio no declara; razón 0.0. D: núcleo detectado por 1 prueba; entrada no detectada; razón 0.68, parcial. E: no entregó nada. E2: sin pruebas; sin pruebas; razón 0.0. F: núcleo detectado por 12 verificaciones; entrada no detectada; razón 0.42, parcial.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif}
text{fill:#000;font-size:14px}
.m{fill:#6e6e73}
.s{font-size:13px}
.h{font-size:15px;font-weight:600}
.b{font-weight:600}
.r{stroke:rgba(60,60,67,.29);stroke-width:1;fill:none}
.a{fill:#3730a3}
.as{stroke:#3730a3;stroke-width:2;fill:none}
.g{fill:#8e8e93}
.gs{stroke:#8e8e93;stroke-width:2;fill:none}
</style>
<text class="b s" x="216" y="14" text-anchor="middle">Núcleo de la</text><text class="b s" x="216" y="31" text-anchor="middle">simulación roto</text><text class="b s" x="322" y="14" text-anchor="middle">Entrada del</text><text class="b s" x="322" y="31" text-anchor="middle">puntero rota</text><text class="m s" x="269" y="48" text-anchor="middle">¿fallaron las pruebas?</text><text class="b s" x="410" y="14" text-anchor="middle">Movimiento</text><text class="b s" x="410" y="31" text-anchor="middle">reducido</text><text class="m s" x="410" y="48" text-anchor="middle">razón</text><path class="r" d="M0 62H440"/><text x="0" y="84"><tspan class="b">A</tspan><tspan class="m" dx="6">Método Launchpad</tspan></text><g><title>A: detectado</title><circle class="a" cx="216" cy="75" r="7"/></g><text class="s" x="216" y="100" text-anchor="middle">pruebas unitarias</text><g><title>A: detectado fuera del comando de pruebas por defecto</title><circle class="as" cx="322" cy="75" r="6"/><path class="a" d="M322 68a7 7 0 0 0 0 14z"/></g><text class="s" x="322" y="100" text-anchor="middle">suite smoke</text><g><title>A: respetado, razón 0.12</title><circle class="a" cx="410" cy="75" r="7"/></g><text class="s" x="410" y="100" text-anchor="middle">0.12</text><path class="r" d="M0 106H440"/><text x="0" y="128"><tspan class="b">B</tspan><tspan class="m" dx="6">Claude Code sin extras</tspan></text><text class="m s" x="216" y="128" text-anchor="middle">sin pruebas<title>B: sin pruebas</title></text><text class="m s" x="322" y="128" text-anchor="middle">sin pruebas<title>B: sin pruebas</title></text><g><title>B: ignorado, razón 1.26</title><circle class="gs" cx="410" cy="119" r="6"/></g><text class="s" x="410" y="144" text-anchor="middle">1.26</text><path class="r" d="M0 150H440"/><text x="0" y="172"><tspan class="b">C</tspan><tspan class="m" dx="6">gstack</tspan></text><g><title>C: detectado</title><circle class="a" cx="216" cy="163" r="7"/></g><text class="s" x="216" y="188" text-anchor="middle">3 pruebas</text><g><title>C: detectado fuera del comando de pruebas por defecto</title><circle class="as" cx="322" cy="163" r="6"/><path class="a" d="M322 156a7 7 0 0 0 0 14z"/></g><text class="s" x="322" y="188" text-anchor="middle">suite de navegador</text><g><title>C: respetado, razón 0.0</title><circle class="a" cx="410" cy="163" r="7"/></g><text class="s" x="410" y="188" text-anchor="middle">0.0</text><path class="r" d="M0 194H440"/><text x="0" y="216"><tspan class="b">D</tspan><tspan class="m" dx="6">ECC</tspan></text><g><title>D: detectado</title><circle class="a" cx="216" cy="207" r="7"/></g><text class="s" x="216" y="232" text-anchor="middle">1 prueba</text><g><title>D: no detectado</title><circle class="gs" cx="322" cy="207" r="6"/></g><text class="s" x="322" y="232" text-anchor="middle">no detectado</text><g><title>D: parcial, razón 0.68</title><circle class="as" cx="410" cy="207" r="6"/><path class="a" d="M410 200a7 7 0 0 0 0 14z"/></g><text class="s" x="410" y="232" text-anchor="middle">0.68</text><path class="r" d="M0 238H440"/><text x="0" y="260"><tspan class="b">E</tspan><tspan class="m" dx="6">Workflow, headless</tspan></text><text class="m s" x="322" y="260" text-anchor="middle">no entregó nada</text><path class="r" d="M0 282H440"/><text x="0" y="304"><tspan class="b">E2</tspan><tspan class="m" dx="6">Workflow, interactivo</tspan></text><text class="m s" x="216" y="304" text-anchor="middle">sin pruebas<title>E2: sin pruebas</title></text><text class="m s" x="322" y="304" text-anchor="middle">sin pruebas<title>E2: sin pruebas</title></text><g><title>E2: respetado, razón 0.0</title><circle class="a" cx="410" cy="295" r="7"/></g><text class="s" x="410" y="320" text-anchor="middle">0.0</text><path class="r" d="M0 326H440"/><text x="0" y="348"><tspan class="b">F</tspan><tspan class="m" dx="6">Equipo de agentes</tspan></text><g><title>F: detectado</title><circle class="a" cx="216" cy="339" r="7"/></g><text class="s" x="216" y="364" text-anchor="middle">12 verificaciones</text><g><title>F: no detectado</title><circle class="gs" cx="322" cy="339" r="6"/></g><text class="s" x="322" y="364" text-anchor="middle">no detectado</text><g><title>F: parcial, razón 0.42</title><circle class="as" cx="410" cy="339" r="6"/><path class="a" d="M410 332a7 7 0 0 0 0 14z"/></g><text class="s" x="410" y="364" text-anchor="middle">0.42</text><path class="r" d="M0 370H440"/><circle class="a" cx="7" cy="395.5" r="7"/><text class="m s" x="22" y="400">detectado; movimiento reducido respetado</text><circle class="as" cx="7" cy="417.5" r="6"/><path class="a" d="M7 410.5a7 7 0 0 0 0 14z"/><text class="m s" x="22" y="422">detectado solo por una suite fuera del comando de pruebas</text><text class="m s" x="22" y="444">por defecto; movimiento reducido parcial</text><circle class="gs" cx="7" cy="461.5" r="6"/><text class="m s" x="22" y="466">no detectado; movimiento reducido ignorado</text>
</svg>
