<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 472 510" width="472" height="510" role="img" aria-labelledby="t d">
<title id="t">What each run's tests guarded, and how it handled reduced motion</title>
<desc id="d">Matrix with one row per run and three columns: whether the run's own tests failed when the simulation core was broken, whether they failed when pointer input was broken, and the reduced-motion ratio. A: core caught by unit tests; input caught only by a smoke suite outside the default test command; ratio 0.12. B: no tests; no tests; ratio 1.26, ignored. C: core caught by 3 tests; input caught only by a browser suite that needs setup the repository does not declare; ratio 0.0. D: core caught by 1 test; input not caught; ratio 0.68, partial. E: nothing shipped. E2: no tests; no tests; ratio 0.0. F: core caught by 12 checks; input not caught; ratio 0.42, partial.</desc>
<style>
svg{font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif}
text{fill:#000;font-size:14px}
.m{fill:#6e6e73}
.s{font-size:13px}
.h{font-size:15px;font-weight:600}
.b{font-weight:600}
.r{stroke:rgba(60,60,67,.29);stroke-width:1;fill:none}
.a{fill:#05714f}
.as{stroke:#05714f;stroke-width:2;fill:none}
.g{fill:#8e8e93}
.gs{stroke:#8e8e93;stroke-width:2;fill:none}
</style>
<text class="b s" x="210" y="14" text-anchor="middle">Simulation</text><text class="b s" x="210" y="31" text-anchor="middle">core broken</text><text class="m s" x="210" y="48" text-anchor="middle">tests failed?</text><text class="b s" x="302" y="14" text-anchor="middle">Pointer</text><text class="b s" x="302" y="31" text-anchor="middle">input broken</text><text class="m s" x="302" y="48" text-anchor="middle">tests failed?</text><text class="b s" x="394" y="14" text-anchor="middle">Reduced</text><text class="b s" x="394" y="31" text-anchor="middle">motion</text><text class="m s" x="394" y="48" text-anchor="middle">motion ratio</text><path class="r" d="M0 62H440"/><text x="0" y="84"><tspan class="b">A</tspan><tspan class="m" dx="6">Launchpad method</tspan></text><g><title>A: caught</title><circle class="a" cx="210" cy="75" r="7"/></g><text class="s" x="210" y="100" text-anchor="middle">unit tests</text><g><title>A: caught outside the default test command</title><circle class="as" cx="302" cy="75" r="6"/><path class="a" d="M302 68a7 7 0 0 0 0 14z"/></g><text class="s" x="302" y="100" text-anchor="middle">smoke suite</text><g><title>A: honored, ratio 0.12</title><circle class="a" cx="394" cy="75" r="7"/></g><text class="s" x="394" y="100" text-anchor="middle">0.12</text><path class="r" d="M0 106H440"/><text x="0" y="128"><tspan class="b">B</tspan><tspan class="m" dx="6">Plain Claude Code</tspan></text><text class="m s" x="210" y="128" text-anchor="middle">no tests<title>B: no tests</title></text><text class="m s" x="302" y="128" text-anchor="middle">no tests<title>B: no tests</title></text><g><title>B: ignored, ratio 1.26</title><circle class="gs" cx="394" cy="119" r="6"/></g><text class="s" x="394" y="144" text-anchor="middle">1.26</text><path class="r" d="M0 150H440"/><text x="0" y="172"><tspan class="b">C</tspan><tspan class="m" dx="6">gstack</tspan></text><g><title>C: caught</title><circle class="a" cx="210" cy="163" r="7"/></g><text class="s" x="210" y="188" text-anchor="middle">3 tests</text><g><title>C: caught outside the default test command</title><circle class="as" cx="302" cy="163" r="6"/><path class="a" d="M302 156a7 7 0 0 0 0 14z"/></g><text class="s" x="302" y="188" text-anchor="middle">browser suite</text><g><title>C: honored, ratio 0.0</title><circle class="a" cx="394" cy="163" r="7"/></g><text class="s" x="394" y="188" text-anchor="middle">0.0</text><path class="r" d="M0 194H440"/><text x="0" y="216"><tspan class="b">D</tspan><tspan class="m" dx="6">ECC</tspan></text><g><title>D: caught</title><circle class="a" cx="210" cy="207" r="7"/></g><text class="s" x="210" y="232" text-anchor="middle">1 test</text><g><title>D: not caught</title><circle class="gs" cx="302" cy="207" r="6"/></g><text class="s" x="302" y="232" text-anchor="middle">not caught</text><g><title>D: partial, ratio 0.68</title><circle class="as" cx="394" cy="207" r="6"/><path class="a" d="M394 200a7 7 0 0 0 0 14z"/></g><text class="s" x="394" y="232" text-anchor="middle">0.68</text><path class="r" d="M0 238H440"/><text x="0" y="260"><tspan class="b">E</tspan><tspan class="m" dx="6">Workflow, headless</tspan></text><text class="m s" x="302" y="260" text-anchor="middle">nothing shipped</text><path class="r" d="M0 282H440"/><text x="0" y="304"><tspan class="b">E2</tspan><tspan class="m" dx="6">Workflow, interactive</tspan></text><text class="m s" x="210" y="304" text-anchor="middle">no tests<title>E2: no tests</title></text><text class="m s" x="302" y="304" text-anchor="middle">no tests<title>E2: no tests</title></text><g><title>E2: honored, ratio 0.0</title><circle class="a" cx="394" cy="295" r="7"/></g><text class="s" x="394" y="320" text-anchor="middle">0.0</text><path class="r" d="M0 326H440"/><text x="0" y="348"><tspan class="b">F</tspan><tspan class="m" dx="6">Agent team</tspan></text><g><title>F: caught</title><circle class="a" cx="210" cy="339" r="7"/></g><text class="s" x="210" y="364" text-anchor="middle">12 checks</text><g><title>F: not caught</title><circle class="gs" cx="302" cy="339" r="6"/></g><text class="s" x="302" y="364" text-anchor="middle">not caught</text><g><title>F: partial, ratio 0.42</title><circle class="as" cx="394" cy="339" r="6"/><path class="a" d="M394 332a7 7 0 0 0 0 14z"/></g><text class="s" x="394" y="364" text-anchor="middle">0.42</text><path class="r" d="M0 370H440"/><circle class="a" cx="7" cy="395.5" r="7"/><text class="m s" x="22" y="400">caught; reduced motion honored</text><circle class="as" cx="7" cy="417.5" r="6"/><path class="a" d="M7 410.5a7 7 0 0 0 0 14z"/><text class="m s" x="22" y="422">caught only by a suite outside the default test command;</text><text class="m s" x="22" y="444">reduced motion partial</text><circle class="gs" cx="7" cy="461.5" r="6"/><text class="m s" x="22" y="466">not caught; reduced motion ignored</text>
</svg>
