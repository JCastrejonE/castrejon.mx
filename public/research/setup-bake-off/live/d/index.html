<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Physarum: three species of living light</title>
  <meta name="description" content="An interactive, generative slime-mould simulation. Three species grow transport networks, avoid each other and chase whatever you paint.">
  <meta name="theme-color" content="#06060b">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22none%22 stroke=%22%23ffb45a%22 stroke-width=%222%22/%3E%3C/svg%3E">
</head>
<body>
  <canvas id="stage" role="img" aria-label="A living simulation of three species of slime mould growing glowing networks. Drag to paint food, shift-drag or right-drag to paint repellent, click to release a burst of new agents."></canvas>

  <main id="hud" aria-label="Controls">
    <header class="title">
      <h1>Physarum</h1>
      <p class="sub"><span id="preset-name">…</span> · <span id="agents">0</span> agents · seed <span id="seed">0</span> · <span id="fps">60</span> fps</p>
    </header>

    <nav class="presets" id="presets" aria-label="Presets"></nav>

    <div class="actions">
      <button type="button" id="btn-pause" aria-pressed="false">Pause</button>
      <button type="button" id="btn-seed">Reseed</button>
      <button type="button" id="btn-clear">Clear paint</button>
      <button type="button" id="btn-save">Save PNG</button>
    </div>

    <p class="help">
      <b>Drag</b> to paint food · <b>Shift / right-drag</b> for repellent · <b>Click</b> to release a burst ·
      <kbd>1</kbd>–<kbd>5</kbd> presets · <kbd>Space</kbd> pause · <kbd>R</kbd> reseed · <kbd>C</kbd> clear · <kbd>S</kbd> save · <kbd>H</kbd> hide
    </p>
  </main>

  <noscript><p class="noscript">This piece needs JavaScript. It is a live simulation.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
