hor="middle">1000</text><line class="hair" x1="227.5" y1="420" x2="227.5" y2="510" stroke-width="1"/><text class="sec num" x="227.5" y="528" font-size="14" text-anchor="middle">1100</text><line class="hair" x1="295" y1="420" x2="295" y2="510" stroke-width="1"/><text class="sec num" x="295" y="528" font-size="14" text-anchor="middle">1200</text><line class="hair" x1="362.5" y1="420" x2="362.5" y2="510" stroke-width="1"/><text class="sec num" x="362.5" y="528" font-size="14" text-anchor="middle">1300</text><line class="hair" x1="430" y1="420" x2="430" y2="510" stroke-width="1"/><text class="sec num" x="430" y="528" font-size="14" text-anchor="middle">1400</text><line class="hair" x1="160" y1="510" x2="430" y2="510" stroke-width="1"/><text class="ink" x="0" y="439" font-size="15">Reencarnación</text><text class="ink" x="0" y="469" font-size="15">Best-fit en línea</text><text class="ink" x="0" y="499" font-size="15">Cota inferior</text><line class="accs" x1="365.2" y1="434" x2="369.3" y2="434" stroke-width="4" stroke-linecap="round"/><circle class="acc ring" cx="367.9" cy="434" r="5.5" stroke-width="2"/><text class="ink num" x="380.3" y="439" font-size="15">1304–1310</text><circle class="gray ring" cx="181.6" cy="464" r="5.5" stroke-width="2"/><text class="ink num" x="192.6" y="469" font-size="15">1032</text><rect class="gray" x="165.9" y="486" width="3" height="16" rx="1"/><text class="ink num" x="176.4" y="499" font-size="15">1011</text></g></svg>
