<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 512 572" width="512" height="572" role="img" aria-labelledby="t d"><title id="t">Contenedores usados en las tres instancias del repositorio</title><desc id="d">Re-ejecución de 2026, 30 semillas por instancia. Con 20 objetos y capacidad 20, la heurística de reencarnación usó 11 contenedores en las 30 ejecuciones, igual a la cota inferior de 11; best-fit en línea usó 12. Con 200 objetos y capacidad 50, usó de 125 a 136 contenedores, con una mediana de 127; best-fit usó 119 y la cota inferior es 111. Con 2000 objetos y capacidad 80, usó de 1304 a 1310 contenedores, con una mediana de 1308; best-fit usó 1032 y la cota inferior es 1011. La cota inferior es la suma de los tamaños de los objetos dividida entre la capacidad, redondeada hacia arriba. Cada panel tiene su propia escala.</desc><style>
svg{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
.ink{fill:#000}
.sec{fill:#6e6e73}
.hair{stroke:rgba(60,60,67,.29)}
.acc{fill:#3730a3}
.accs{stroke:#3730a3}
.gray{fill:#6e6e73}
.grays{stroke:#6e6e73}
.track{fill:rgba(120,120,128,.16)}
.on{fill:#fff}
.ring{stroke:#fff}
.num{font-variant-numeric:tabular-nums}
</style><g><line class="accs" x1="3" y1="20" x2="35" y2="20" stroke-width="4" stroke-linecap="round"/><circle class="acc ring" cx="19" cy="20" r="5" stroke-width="2"/><text class="sec" x="44" y="25" font-size="15">Reencarnación: de la mejor a la peor de 30 semillas,</text><text class="sec" x="44" y="44" font-size="15">punto en la mediana</text></g><g><text class="ink" x="0" y="74" font-size="16" font-weight="600">20 objetos, capacidad 20</text><line class="hair" x1="160" y1="84" x2="160" y2="174" stroke-width="1"/><text class="sec num" x="160" y="192" font-size="14" text-anchor="middle">10</text><line class="hair" x1="227.5" y1="84" x2="227.5" y2="174" stroke-width="1"/><text class="sec num" x="227.5" y="192" font-size="14" text-anchor="middle">11</text><line class="hair" x1="295" y1="84" x2="295" y2="174" stroke-width="1"/><text class="sec num" x="295" y="192" font-size="14" text-anchor="middle">12</text><line class="hair" x1="362.5" y1="84" x2="362.5" y2="174" stroke-width="1"/><text class="sec num" x="362.5" y="192" font-size="14" text-anchor="middle">13</text><line class="hair" x1="430" y1="84" x2="430" y2="174" stroke-width="1"/><text class="sec num" x="430" y="192" font-size="14" text-anchor="middle">14</text><line class="hair" x1="160" y1="174" x2="430" y2="174" stroke-width="1"/><text class="ink" x="0" y="103" font-size="15">Reencarnación</text><text class="ink" x="0" y="133" font-size="15">Best-fit en línea</text><text class="ink" x="0" y="163" font-size="15">Cota inferior</text><circle class="acc ring" cx="227.5" cy="98" r="5.5" stroke-width="2"/><text class="ink num" x="238.5" y="103" font-size="15">11 en las 30 ejecuciones</text><circle class="gray ring" cx="295" cy="128" r="5.5" stroke-width="2"/><text class="ink num" x="306" y="133" font-size="15">12</text><rect class="gray" x="226" y="150" width="3" height="16" rx="1"/><text class="ink num" x="236.5" y="163" font-size="15">11</text></g><g><text class="ink" x="0" y="242" font-size="16" font-weight="600