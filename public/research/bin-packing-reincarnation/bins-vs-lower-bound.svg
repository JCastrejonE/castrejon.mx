<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 512 572" width="512" height="572" role="img" aria-labelledby="t d"><title id="t">Bins used on the three repository instances</title><desc id="d">Re-run in 2026, 30 seeds per instance. On 20 items with capacity 20, the reincarnation heuristic used 11 bins in all 30 runs, equal to the lower bound of 11; online best-fit used 12. On 200 items with capacity 50, it used 125 to 136 bins with a median of 127; best-fit used 119 and the lower bound is 111. On 2000 items with capacity 80, it used 1304 to 1310 bins with a median of 1308; best-fit used 1032 and the lower bound is 1011. The lower bound is the sum of item sizes divided by the capacity, rounded up. Each panel has its own scale.</desc><style>
svg{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
.ink{fill:#000}
.sec{fill:#6e6e73}
.hair{stroke:rgba(60,60,67,.29)}
.acc{fill:#3730a3}
.accs{stroke:#3730a3}
.gray{fill:#6e6e73}
.grays{stroke:#6e6e73}
.track{fill:rgba(120,120,128,.16)}
.on{fill:#fff}
.ring{stroke:#fff}
.num{font-variant-numeric:tabular-nums}
</style><g><line class="accs" x1="3" y1="20" x2="35" y2="20" stroke-width="4" stroke-linecap="round"/><circle class="acc ring" cx="19" cy="20" r="5" stroke-width="2"/><text class="sec" x="44" y="25" font-size="15">Reincarnation: best to worst of 30 seeds,</text><text class="sec" x="44" y="44" font-size="15">dot at the median</text></g><g><text class="ink" x="0" y="74" font-size="16" font-weight="600">20 items, capacity 20</text><line class="hair" x1="160" y1="84" x2="160" y2="174" stroke-width="1"/><text class="sec num" x="160" y="192" font-size="14" text-anchor="middle">10</text><line class="hair" x1="227.5" y1="84" x2="227.5" y2="174" stroke-width="1"/><text class="sec num" x="227.5" y="192" font-size="14" text-anchor="middle">11</text><line class="hair" x1="295" y1="84" x2="295" y2="174" stroke-width="1"/><text class="sec num" x="295" y="192" font-size="14" text-anchor="middle">12</text><line class="hair" x1="362.5" y1="84" x2="362.5" y2="174" stroke-width="1"/><text class="sec num" x="362.5" y="192" font-size="14" text-anchor="middle">13</text><line class="hair" x1="430" y1="84" x2="430" y2="174" stroke-width="1"/><text class="sec num" x="430" y="192" font-size="14" text-anchor="middle">14</text><line class="hair" x1="160" y1="174" x2="430" y2="174" stroke-width="1"/><text class="ink" x="0" y="103" font-size="15">Reincarnation</text><text class="ink" x="0" y="133" font-size="15">Best-fit, online</text><text class="ink" x="0" y="163" font-size="15">Lower bound</text><circle class="acc ring" cx="227.5" cy="98" r="5.5" stroke-width="2"/><text class="ink num" x="238.5" y="103" font-size="15">11 in all 30 runs</text><circle class="gray ring" cx="295" cy="128" r="5.5" stroke-width="2"/><text class="ink num" x="306" y="133" font-size="15">12</text><rect class="gray" x="226" y="150" width="3" height="16" rx="1"/><text class="ink num" x="236.5" y="163" font-size="15">11</text></g><g><text class="ink" x="0" y="242" font-size="16" font-weight="600">200 items, capacity 50</text><line class="hair" x1="160" y1="252" x2="160" y2="342" stroke-width="1"/><text class="sec num" x="160" y="360" font-size="14" text-anchor="middle">100</text><line class="hair" x1="214" y1="252" x2="214" y2="342" stroke-width="1"/><text class="sec num" x="214" y="360" font-size="14" text-anchor="middle">110</text><line class="hair" x1="268" y1="252" x2="268" y2="342" stroke-width="1"/><text class="sec num" x="268" y="360" font-size="14" text-anchor="middle">120</text><line class="hair" x1="322" y1="252" x2="322" y2="342" stroke-width="1"/><text class="sec num" x="322" y="360" font-size="14" text-anchor="middle">130</text><line class="hair" x1="376" y1="252" x2="376" y2="342" stroke-width="1"/><text class="sec num" x="376" y="360" font-size="14" text-anchor="middle">140</text><line class="hair" x1="430" y1="252" x2="430" y2="342" stroke-width="1"/><text class="sec num" x="430" y="360" font-size="14" text-anchor="middle">150</text><line class="hair" x1="160" y1="342" x2="430" y2="342" stroke-width="1"/><text class="ink" x="0" y="271" font-size="15">Reincarnation</text><text class="ink" x="0" y="301" font-size="15">Best-fit, online</text><text class="ink" x="0" y="331" font-size="15">Lower bound</text><line class="accs" x1="295" y1="266" x2="354.4" y2="266" stroke-width="4" stroke-linecap="round"/><circle class="acc ring" cx="305.8" cy="266" r="5.5" stroke-width="2"/><text class="ink num" x="365.4" y="271" font-size="15">125–136</text><circle class="gray ring" cx="262.6" cy="296" r="5.5" stroke-width="2"/><text class="ink num" x="273.6" y="301" font-size="15">119</text><rect class="gray" x="217.9" y="318" width="3" height="16" rx="1"/><text class="ink num" x="228.4" y="331" font-size="15">111</text></g><g><text class="ink" x="0" y="410" font-size="16" font-weight="600">2000 items, capacity 80</text><line class="hair" x1="160" y1="420" x2="160" y2="510" stroke-width="1"/><text class="sec num" x="160" y="528" font-size="14" text-anchor="middle">1000</text><line class="hair" x1="227.5" y1="420" x2="227.5" y2="510" stroke-width="1"/><text class="sec num" x="227.5" y="528" font-size="14" text-anchor="middle">1100</text><line class="hair" x1="295" y1="420" x2="295" y2="510" stroke-width="1"/><text class="sec num" x="295" y="528" font-size="14" text-anchor="middle">1200</text><line class="hair" x1="362.5" y1="420" x2="362.5" y2="510" stroke-width="1"/><text class="sec num" x="362.5" y="528" font-size="14" text-anchor="middle">1300</text><line class="hair" x1="430" y1="420" x2="430" y2="510" stroke-width="1"/><text class="sec num" x="430" y="528" font-size="14" text-anchor="middle">1400</text><line class="hair" x1="160" y1="510" x2="430" y2="510" stroke-width="1"/><text class="ink" x="0" y="439" font-size="15">Reincarnation</text><text class="ink" x="0" y="469" font-size="15">Best-fit, online</text><text class="ink" x="0" y="499" font-size="15">Lower bound</text><line class="accs" x1="365.2" y1="434" x2="369.3" y2="434" stroke-width="4" stroke-linecap="round"/><circle class="acc ring" cx="367.9" cy="434" r="5.5" stroke-width="2"/><text class="ink num" x="380.3" y="439" font-size="15">1304–1310</text><circle class="gray ring" cx="181.6" cy="464" r="5.5" stroke-width="2"/><text class="ink num" x="192.6" y="469" font-size="15">1032</text><rect class="gray" x="165.9" y="486" width="3" height="16" rx="1"/><text class="ink num" x="176.4" y="499" font-size="15">1011</text></g></svg>
