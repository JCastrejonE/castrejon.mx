eviewer agent</tspan></text><path class="gry" d="M302 264H302.4A4 4 0 0 1 306.4 268V276A4 4 0 0 1 302.4 280H302Z"/><text class="ink num" x="314.4" y="277" font-size="14">2 (1%)</text><text class="ink" x="290" y="308.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">An outage of Launchpad's own</tspan><tspan x="290" dy="17">production</tspan></text><path class="gry" d="M302 304H302.4A4 4 0 0 1 306.4 308V316A4 4 0 0 1 302.4 320H302Z"/><text class="ink num" x="314.4" y="317" font-size="14">2 (1%)</text><text class="ink" x="290" y="357" font-size="14" text-anchor="end"><tspan x="290" dy="0">Spec review</tspan></text><path class="gry" d="M302 344H302A2.1848739495798317 2.1848739495798317 0 0 1 304.2 346.2V357.8A2.1848739495798317 2.1848739495798317 0 0 1 302 360H302Z"/><text class="ink num" x="312.2" y="357" font-size="14">1 (&lt;1%)</text><text class="ink b" x="290" y="397" font-size="14" text-anchor="end"><tspan x="290" dy="0">A unit test going red</tspan></text><text class="ink num b" x="310" y="397" font-size="14">0 (0%)</text>
