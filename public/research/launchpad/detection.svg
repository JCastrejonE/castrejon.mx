<svg xmlns="http://www.w3.org/2000/svg" class="lpdw" width="672" height="424" viewBox="0 0 672 424" role="img" aria-labelledby="lpdw-t lpdw-d">
<title id="lpdw-t">What detected each of the 225 Launchpad defects</title>
<desc id="lpdw-d">Horizontal bar chart of the 225 defects in the Launchpad record, by what detected each one: Running the real system and reading its state, 119 (53%); The author noticing their own instrument was wrong, 43 (19%); A person reading code or docs, 31 (14%); Hitting it while using the product, 16 (7%); The gate: build, typecheck or lint, 7 (3%); Breaking the code and watching a test go red, 4 (2%); A reviewer agent, 2 (1%); An outage of Launchpad's own production, 2 (1%); Spec review, 1 (&lt;1%); A unit test going red, 0 (0%). Shares are as printed in the record. Source: docs/PROOF-OF-WORK.md, section 1.</desc>
<style>
.lpdw text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
.lpdw .ink{fill:#000}
.lpdw .sec{fill:#6e6e73}
.lpdw .hair{stroke:rgba(60,60,67,.29);stroke-width:1;fill:none}
.lpdw .acc{fill:#05714f}
.lpdw .gry{fill:#8e8e93}
.lpdw .gry2{fill:#c7c7cc}
.lpdw .on-acc{fill:#fff}
.lpdw .on-gry{fill:#000}
.lpdw .on-gry2{fill:#000}
.lpdw .b{font-weight:600}
.lpdw .num{font-variant-numeric:tabular-nums}

</style>
