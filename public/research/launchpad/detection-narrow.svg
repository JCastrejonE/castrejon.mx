.lpdn .on-acc{fill:#fff}
.lpdn .on-gry{fill:#000}
.lpdn .on-gry2{fill:#000}
.lpdn .b{font-weight:600}
.lpdn .num{font-variant-numeric:tabular-nums}

</style>
