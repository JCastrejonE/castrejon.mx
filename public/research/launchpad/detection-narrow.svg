<svg xmlns="http://www.w3.org/2000/svg" class="lpdn" width="343" height="454" viewBox="0 0 343 454" role="img" aria-labelledby="lpdn-t lpdn-d">
<title id="lpdn-t">What detected each of the 225 Launchpad defects</title>
<desc id="lpdn-d">Horizontal bar chart of the 225 defects in the Launchpad record, by what detected each one: Running the real system and reading its state, 119 (53%); The author noticing their own instrument was wrong, 43 (19%); A person reading code or docs, 31 (14%); Hitting it while using the product, 16 (7%); The gate: build, typecheck or lint, 7 (3%); Breaking the code and watching a test go red, 4 (2%); A reviewer agent, 2 (1%); An outage of Launchpad's own production, 2 (1%); Spec review, 1 (&lt;1%); A unit test going red, 0 (0%). Shares are as printed in the record. Source: docs/PROOF-OF-WORK.md, section 1.</desc>
<style>
