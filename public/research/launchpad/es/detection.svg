<svg xmlns="http://www.w3.org/2000/svg" class="lpdw" width="672" height="424" viewBox="0 0 672 424" role="img" aria-labelledby="lpdw-t lpdw-d" lang="es">
<title id="lpdw-t">Qué detectó cada uno de los 225 defectos de Launchpad</title>
<desc id="lpdw-d">Gráfica de barras horizontales de los 225 defectos del registro de Launchpad, según lo que detectó cada uno: Ejecutar el sistema real y leer su estado, 119 (53%); El autor nota que su propio instrumento está mal, 43 (19%); Una persona que lee código o documentación, 31 (14%); Toparse con él al usar el producto, 16 (7%); El gate: build, typecheck o lint, 7 (3%); Romper el código y ver una prueba en rojo, 4 (2%); Un agente revisor, 2 (1%); Una caída de la producción del propio Launchpad, 2 (1%); Revisión de specs, 1 (&lt;1%); Una prueba unitaria en rojo, 0 (0%). Los porcentajes son los que imprime el registro. Fuente: docs/PROOF-OF-WORK.md, sección 1.</desc>
<style>
.lpdw text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;}
.lpdw .ink{fill:#000}
.lpdw .sec{fill:#6e6e73}
.lpdw .hair{stroke:rgba(60,60,67,.29);stroke-width:1;fill:none}
.lpdw .acc{fill:#05714f}
.lpdw .gry{fill:#8e8e93}
.lpdw .gry2{fill:#c7c7cc}
.lpdw .on-acc{fill:#fff}
.lpdw .on-gry{fill:#000}
.lpdw .on-gry2{fill:#000}
.lpdw .b{font-weight:600}
.lpdw .num{font-variant-numeric:tabular-nums}

</style>
<path class="hair" d="M301.5 18V406"/><text class="ink b" x="290" y="28.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">Ejecutar el sistema real</tspan><tspan x="290" dy="17">y leer su estado</tspan></text><path class="acc" d="M302 24H558A4 4 0 0 1 562 28V36A4 4 0 0 1 558 40H302Z"/><text class="ink num b" x="570" y="37" font-size="14">119 (53%)</text><text class="ink" x="290" y="68.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">El autor nota que su propio</tspan><tspan x="290" dy="17">instrumento está mal</tspan></text><path class="gry" d="M302 64H391.9A4 4 0 0 1 395.9 68V76A4 4 0 0 1 391.9 80H302Z"/><text class="ink num" x="403.9" y="77" font-size="14">43 (19%)</text><text class="ink" x="290" y="108.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">Una persona que lee código</tspan><tspan x="290" dy="17">o documentación</tspan></text><path class="gry" d="M302 104H365.7A4 4 0 0 1 369.7 108V116A4 4 0 0 1 365.7 120H302Z"/><text class="ink num" x="377.7" y="117" font-size="14">31 (14%)</text><text class="ink" x="290" y="157" font-size="14" text-anchor="end"><tspan x="290" dy="0">Toparse con él al usar el producto</tspan></text><path class="gry" d="M302 144H333A4 4 0 0 1 337 148V156A4 4 0 0 1 333 160H302Z"/><text class="ink num" x="345" y="157" font-size="14">16 (7%)</text><text class="ink" x="290" y="197" font-size="14" text-anchor="end"><tspan x="290" dy="0">El gate: build, typecheck o lint</tspan></text><path class="gry" d="M302 184H313.3A4 4 0 0 1 317.3 188V196A4 4 0 0 1 313.3 200H302Z"/><text class="ink num" x="325.3" y="197" font-size="14">7 (3%)</text><text class="ink" x="290" y="228.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">Romper el código y ver</tspan><tspan x="290" dy="17">una prueba en rojo</tspan></text><path class="gry" d="M302 224H306.7A4 4 0 0 1 310.7 228V236A4 4 0 0 1 306.7 240H302Z"/><text class="ink num" x="318.7" y="237" font-size="14">4 (2%)</text><text class="ink" x="290" y="277" font-size="14" text-anchor="end"><tspan x="290" dy="0">Un agente revisor</tspan></text><path class="gry" d="M302 264H302.4A4 4 0 0 1 306.4 268V276A4 4 0 0 1 302.4 280H302Z"/><text class="ink num" x="314.4" y="277" font-size="14">2 (1%)</text><text class="ink" x="290" y="308.5" font-size="14" text-anchor="end"><tspan x="290" dy="0">Una caída de la producción</tspan><tspan x="290" dy="17">del propio Launchpad</tspan></text><path class="gry" d="M302 304H302.4A4 4 0 0 1 306.4 308V316A4 4 0 0 1 302.4 320H302Z"/><text class="ink num" x="314.4" y="317" font-size="14">2 (1%)</text><text class="ink" x="290" y="357" font-size="14" text-anchor="end"><tspan x="290" dy="0">Revisión de specs</tspan></text><path class="gry" d="M302 344H302A2.1848739495798317 2.1848739495798317 0 0 1 304.2 346.2V357.8A2.1848739495798317 2.1848739495798317 0 0 1 302 360H302Z"/><text class="ink num" x="312.2" y="357" font-size="14">1 (&lt;1%)</text><text class="ink b" x="290" y="397" font-size="14" text-anchor="end"><tspan x="290" dy="0">Una prueba unitaria en rojo</tspan></text><text class="ink num b" x="310" y="397" font-size="14">0 (0%)</text>
</svg>
