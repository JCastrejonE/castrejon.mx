<svg xmlns="http://www.w3.org/2000/svg" class="lptn" width="343" height="154" viewBox="0 0 343 154" role="img" aria-labelledby="lptn-t lptn-d" lang="es">
<title id="lptn-t">En qué se fue el tiempo de reloj de una ejecución medida</title>
<desc id="lptn-d">Barra de proporciones para las cinco sesiones de agente de la spec 0105 (claude-opus-4-8), 2,241 segundos de tiempo de reloj en total: inferencia del modelo, 1,545 segundos (69%); herramientas en ejecución, 308 segundos; y 388 segundos que la tabla fuente no atribuye a ninguna de las dos. Fuente: docs/AGENT-PERFORMANCE.md, tabla base; los 388 segundos son la diferencia de los totales impresos.</desc>
