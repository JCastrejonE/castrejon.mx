</style>
<text class="ink b" x="12" y="18" font-size="13"><tspan x="12" dy="0">Spec 0105, cinco sesiones de agente: 2,241 s</tspan><tspan x="12" dy="18">de tiempo de reloj</tspan></text><path class="acc" d="M16 48H229.2V74H16A4 4 0 0 1 12 70V52A4 4 0 0 1 16 48Z"/><text class="on-acc num b" x="20" y="65.3" font-size="12">1,545 s (69%)</text><path class="gry" d="M231.2 48H274.5V74H231.2Z"/><path class="gry2" d="M276.5 48H327A4 4 0 0 1 331 52V70A4 4 0 0 1 327 74H276.5Z"/><text class="on-gry2 num" x="284.5" y="65.3" font-size="12">388 s</text><rect class="acc" x="12" y="91" width="10" height="10" rx="2"/><text class="sec" x="28" y="100" font-size="12">Inferencia del modelo, <tspan class="ink num">1,545 s (69%)</tspan></text><rect class="gry" x="12" y="111" width="10" height="10" rx="2"/><text class="sec" x="28" y="120" font-size="12">Herramientas en ejecución, <tspan class="ink num">308 s</tspan></text><rect class="gry2" x="12" y="131" width="10" height="10" rx="2"/><text class="sec" x="28" y="140" font-size="12">Sin atribuir en la tabla fuente, <tspan class="ink num">388 s</tspan></text>
