<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 386" width="440" height="386" role="img" aria-labelledby="t d">
<title id="t">La instancia de 15 vértices del reporte con su mejor cobertura</title>
<desc id="d">Gráfica de inputs/prueba.txt: 15 vértices, 24 aristas, todos los pesos iguales a 1. Un camino recorre los vértices del 2 al 14; los vértices 0 y 1 están unidos cada uno a los vértices 3, 5, 7, 9, 11 y 13. La mejor cobertura que encontró la colonia de hormigas, que también es el óptimo exacto, son los vértices 3, 5, 7, 9, 11 y 13, dibujados como círculos rellenos; los otros 9 vértices están huecos. La heurística greedy elige primero los vértices 0 y 1 y termina con 8 vértices: 0, 1, 3, 5, 7, 9, 11, 13.</desc>
