<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 542" width="440" height="542" role="img" aria-labelledby="t d">
<title id="t">Tamaño de las coberturas de la heurística greedy y de la colonia de hormigas en cinco instancias</title>
<desc id="d">Re-ejecución en 2026 del solver de 2019, con 100 semillas por instancia, graficada como el tamaño de la cobertura sobre el óptimo exacto de un programa entero. prueba.txt (15 vértices, 24 aristas): greedy 8, colonia de hormigas 6–7 (23 semillas en 6, 77 semillas en 7), óptimo exacto 6. g.txt (20 vértices, 55 aristas): greedy 13, colonia de hormigas 8–10 (3 semillas en 8, 95 semillas en 9, 2 semillas en 10), óptimo exacto 8. grafica2.txt (100 vértices, 174 aristas): greedy 54, colonia de hormigas 54 (100 semillas en 54), óptimo exacto 53. trampa2-100.txt (100 vértices, 2548 aristas): greedy 74, colonia de hormigas 52–74 (62 semillas en 52, 8 semillas en 53, 30 semillas en 74), óptimo exacto 52. trampa200.txt (200 vértices, 4555 aristas): greedy 133, colonia de hormigas 68 (100 semillas en 68), óptimo exacto 68.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;font-size:14px}
.ink{fill:#000}
.sec{fill:#6e6e73}
.b{font-weight:600}
.hair{stroke:rgba(60,60,67,.29);stroke-width:1;fill:none}
.edge{stroke:#6e6e73;stroke-width:1.25;fill:none}
.acc{fill:#3730a3}
.accS{stroke:#3730a3;fill:none}
.gry{fill:#6e6e73}
.gryS{stroke:#6e6e73;fill:none}
.onacc{fill:#fff}
</style>
<rect class="gry" x="16" y="12" width="9" height="9" rx="1.5"/>
<text class="ink" x="32" y="21">Heurística greedy (una ejecución determinista)</text>
<line class="accS" x1="16" y1="38" x2="30" y2="38" stroke-width="3" stroke-linecap="round"/>
<circle class="acc" cx="16" cy="38" r="4.5"/><circle class="acc" cx="30" cy="38" r="4.5"/>
<text class="ink" x="42" y="42">Colonia de hormigas: cada costo obtenido en 100 semillas</text>
<g>
<text x="16" y="76"><tspan class="ink b">prueba.txt</tspan><tspan class="sec" dx="8">15 vértices, 24 aristas, la instancia del reporte</tspan></text>
<text class="sec" x="16" y="94">Óptimo exacto 6; la colonia lo alcanzó en 23 de 100 semillas</text>
<line class="edge" x1="16" y1="104" x2="16" y2="144"/>
<line class="hair" x1="110" y1="104" x2="110" y2="144"/>
<line class="hair" x1="204" y1="104" x2="204" y2="144"/>
<line class="hair" x1="298" y1="104" x2="298" y2="144"/>
<line class="hair" x1="392" y1="104" x2="392" y2="144"/>
<g><title>prueba.txt: la cobertura greedy tiene 8 vértices (óptimo 6)</title><rect class="gry" x="136.8" y="109.5" width="9" height="9" rx="1.5"/><text class="ink" x="151.3" y="118.5">8</text></g>
<g><title>prueba.txt: colonia de hormigas, 23 semillas en 6, 77 semillas en 7</title><line class="accS" x1="16" y1="134" x2="78.7" y2="134" stroke-width="3" stroke-linecap="round"/><circle class="acc" cx="16" cy="134" r="4.5"/><circle class="acc" cx="78.7" cy="134" r="4.5"/><text class="ink" x="88.7" y="138.5">6–7</text></g>
</g>
<g>
<text x="16" y="162"><tspan class="ink b">g.txt</tspan><tspan class="sec" dx="8">20 vértices, 55 aristas</tspan></text>
<text class="sec" x="16" y="180">Óptimo exacto 8; la colonia lo alcanzó en 3 de 100 semillas</text>
<line class="edge" x1="16" y1="190" x2="16" y2="230"/>
<line class="hair" x1="110" y1="190" x2="110" y2="230"/>
<line class="hair" x1="204" y1="190" x2="204" y2="230"/>
<line class="hair" x1="298" y1="190" x2="298" y2="230"/>
<line class="hair" x1="392" y1="190" x2="392" y2="230"/>
<g><title>g.txt: la cobertura greedy tiene 13 vértices (óptimo 8)</title><rect class="gry" x="246.5" y="195.5" width="9" height="9" rx="1.5"/><text class="ink" x="261" y="204.5">13</text></g>
<g><title>g.txt: colonia de hormigas, 3 semillas en 8, 95 semillas en 9, 2 semillas en 10</title><line class="accS" x1="16" y1="220" x2="110" y2="220" stroke-width="3" stroke-linecap="round"/><circle class="acc" cx="16" cy="220" r="4.5"/><circle class="acc" cx="63" cy="220" r="4.5"/><circle class="acc" cx="110" cy="220" r="4.5"/><text class="ink" x="120" y="224.5">8–10</text></g>
</g>
<g>
<text x="16" y="248"><tspan class="ink b">grafica2.txt</tspan><tspan class="sec" dx="8">100 vértices, 174 aristas</tspan></text>
<text class="sec" x="16" y="266">Óptimo exacto 53; la colonia lo alcanzó en 0 de 100 semillas</text>
<line class="edge" x1="16" y1="276" x2="16" y2="316"/>
<line class="hair" x1="110" y1="276" x2="110" y2="316"/>
<line class="hair" x1="204" y1="276" x2="204" y2="316"/>
<line class="hair" x1="298" y1="276" x2="298" y2="316"/>
<line class="hair" x1="392" y1="276" x2="392" y2="316"/>
<g><title>grafica2.txt: la cobertura greedy tiene 54 vértices (óptimo 53)</title><rect class="gry" x="18.6" y="281.5" width="9" height="9" rx="1.5"/><text class="ink" x="33.1" y="290.5">54</text></g>
<g><title>grafica2.txt: colonia de hormigas, 100 semillas en 54</title><circle class="acc" cx="23.1" cy="306" r="4.5"/><text class="ink" x="33.1" y="310.5">54</text></g>
</g>
<g>
<text x="16" y="334"><tspan class="ink b">trampa2-100.txt</tspan><tspan class="sec" dx="8">100 vértices, 2,548 aristas</tspan></text>
<text class="sec" x="16" y="352">Óptimo exacto 52; la colonia lo alcanzó en 62 de 100 semillas</text>
<line class="edge" x1="16" y1="362" x2="16" y2="402"/>
<line class="hair" x1="110" y1="362" x2="110" y2="402"/>
<line class="hair" x1="204" y1="362" x2="204" y2="402"/>
<line class="hair" x1="298" y1="362" x2="298" y2="402"/>
<line class="hair" x1="392" y1="362" x2="392" y2="402"/>
<g><title>trampa2-100.txt: la cobertura greedy tiene 74 vértices (óptimo 52)</title><rect class="gry" x="170.6" y="367.5" width="9" height="9" rx="1.5"/><text class="ink" x="185.1" y="376.5">74</text></g>
<g><title>trampa2-100.txt: colonia de hormigas, 62 semillas en 52, 8 semillas en 53, 30 semillas en 74</title><line class="accS" x1="16" y1="392" x2="175.1" y2="392" stroke-width="3" stroke-linecap="round"/><circle class="acc" cx="16" cy="392" r="4.5"/><circle class="acc" cx="23.2" cy="392" r="4.5"/><circle class="acc" cx="175.1" cy="392" r="4.5"/><text class="ink" x="185.1" y="396.5">52–74</text></g>
</g>
<g>
<text x="16" y="420"><tspan class="ink b">trampa200.txt</tspan><tspan class="sec" dx="8">200 vértices, 4,555 aristas</tspan></text>
<text class="sec" x="16" y="438">Óptimo exacto 68; la colonia lo alcanzó en 100 de 100 semillas</text>
<line class="edge" x1="16" y1="448" x2="16" y2="488"/>
<line class="hair" x1="110" y1="448" x2="110" y2="488"/>
<line class="hair" x1="204" y1="448" x2="204" y2="488"/>
<line class="hair" x1="298" y1="448" x2="298" y2="488"/>
<line class="hair" x1="392" y1="448" x2="392" y2="488"/>
<g><title>trampa200.txt: la cobertura greedy tiene 133 vértices (óptimo 68)</title><rect class="gry" x="370.9" y="453.5" width="9" height="9" rx="1.5"/><text class="ink" x="385.4" y="462.5">133</text></g>
<g><title>trampa200.txt: colonia de hormigas, 100 semillas en 68</title><circle class="acc" cx="16" cy="478" r="4.5"/><text class="ink" x="26" y="482.5">68</text></g>
</g>
<text class="sec" x="14" y="508" text-anchor="start">óptimo</text>
<text class="sec" x="110" y="508" text-anchor="middle">+25%</text>
<text class="sec" x="204" y="508" text-anchor="middle">+50%</text>
<text class="sec" x="298" y="508" text-anchor="middle">+75%</text>
<text class="sec" x="392" y="508" text-anchor="middle">+100%</text>
<text class="sec" x="16" y="530">Tamaño de cobertura sobre el óptimo exacto. Pesos unitarios.</text>
</svg>
