<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 386" width="440" height="386" role="img" aria-labelledby="t d">
<title id="t">The report’s 15-vertex instance with its best cover</title>
<desc id="d">Graph from inputs/prueba.txt: 15 vertices, 24 edges, every weight 1. A path runs through vertices 2 to 14; vertices 0 and 1 each connect to vertices 3, 5, 7, 9, 11 and 13. The best cover found by the ant colony, and the exact optimum, is vertices 3, 5, 7, 9, 11 and 13, drawn as filled circles; the other 9 vertices are hollow. The greedy heuristic picks vertices 0 and 1 first and ends with 8 vertices: 0, 1, 3, 5, 7, 9, 11, 13.</desc>
